apiVersion: apps/v1
kind: Deployment
metadata:
  name: researchmind-backend
  labels:
    app: researchmind-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: researchmind-backend
  template:
    metadata:
      labels:
        app: researchmind-backend
    spec:
    spec:
      containers:
        - name: backend
          image: researchmind-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: LLM_PROVIDER
              value: "groq"
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: researchmind-secrets
                  key: groq-api-key
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: researchmind-backend-svc
spec:
  selector:
    app: researchmind-backend
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP
