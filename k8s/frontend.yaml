apiVersion: apps/v1
kind: Deployment
metadata:
  name: researchmind-frontend
  labels:
    app: researchmind-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: researchmind-frontend
  template:
    metadata:
      labels:
        app: researchmind-frontend
    spec:
      containers:
        - name: frontend
          image: researchmind-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: PORT
              value: "3000"
            - name: NEXT_PUBLIC_API_URL
              value: "http://researchmind-backend-svc:8000"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: researchmind-frontend-svc
spec:
  selector:
    app: researchmind-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
  type: LoadBalancer